<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <rect width="1920" height="1080" fill="#0078D7" />

  <g fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, &#39;Microsoft YaHei&#39;, &#39;PingFang SC&#39;, sans-serif">
    <text x="260" y="155" font-size="64" font-weight="300">恢复</text>

    <text x="260" y="255" font-size="34" font-weight="400">无法正常启动你的电脑</text>

    <text x="260" y="325" font-size="23" font-weight="300">在多次尝试后，你的电脑上的操作系统仍无法启动，因此需要对其进行修复。</text>
    <text x="260" y="390" font-size="23" font-weight="500">错误代码: 0xc0000001</text>
    
    <text x="260" y="470" font-size="23" font-weight="300">你需要使用恢复工具。如果没有任何安装介质(如光盘或 USB</text>
    <text x="260" y="510" font-size="23" font-weight="300">设备)，请联系你的电脑管理员或电脑/设备制造商。</text>

    <g font-size="28" font-weight="300">
      <text x="260" y="775">按 Enter 可重试</text>
      <text x="260" y="825">按 F1 进入恢复环境</text>
      <text x="260" y="875">按 F8 以指定启动设置</text>
      <text x="260" y="925">按 Esc 以指定 UEFI 固件设置</text>
    </g>
  </g>
</svg>