<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <rect width="1920" height="1080" fill="#0078D7" />

  <g fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, &#39;Microsoft YaHei&#39;, &#39;PingFang SC&#39;, sans-serif">
    <text x="260" y="155" font-size="64" font-weight="300">Recovery</text>

    <text x="260" y="255" font-size="34" font-weight="400">Your PC couldn&#39;t start properly</text>

    <text x="260" y="325" font-size="23" font-weight="300">After multiple tries, the operating system on your PC failed to start, so it needs to be</text>
    <text x="260" y="365" font-size="23" font-weight="300">repaired.</text>
    <text x="260" y="430" font-size="23" font-weight="500">Error code: 0xc0000001</text>

    <text x="260" y="505" font-size="23" font-weight="300">You&#39;ll need to use recovery tools. If you don&#39;t have any installation media (like a disc or</text>
    <text x="260" y="545" font-size="23" font-weight="300">USB device), contact your PC administrator or PC/Device manufacturer.</text>

    <g font-size="28" font-weight="300">
      <text x="260" y="775">Press Enter to try again</text>
      <text x="260" y="825">Press F1 to enter Recovery Environment</text>
      <text x="260" y="875">Press F8 for Startup Settings</text>
      <text x="260" y="925">Press Esc for UEFI Firmware Settings</text>
    </g>
  </g>
</svg>
